# Configuração para aplicação TSP - Ant Colony Optimization

[app]
title = "TSP - Ant Colony Optimization"
window_width = 1280.0
window_height = 720.0

[rendering]
clear_color_r = 0.1
clear_color_g = 0.1
clear_color_b = 0.1
clear_color_a = 1.0
watch_for_changes = false

[memory]
max_points_in_view = 2000
use_arena_allocation = true
reuse_vectors = true
vector_pool_size = 512

[gpu]
enabled = true
use_gpu_threshold = 100
compute_shader_path = "shaders/aco_compute.wgsl"
opengl_version = "GL4_6"                         # Valores possíveis: "GL4_3", "GL4_6"
synchronize_with_cpu = true

[aco]
ant_count = 20
alpha = 1.0
beta = 2.0
rho = 0.5
q = 100.0
candidate_list_size = 20
max_iterations = 1000
max_iterations_without_improvement = 50
